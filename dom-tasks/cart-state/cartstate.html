<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Cart</title>
  <link rel="stylesheet" href="cartstate.css">
</head>
<body class="bg-slate-950 text-white ">
    <h1 class="pl-8 text-4xl font-bold">Fruits Cart🍇</h1>
    
<div class="md:flex items-start h-screen ">

<div class="md:w-2/3 p-6 grid grid-cols-2 md:grid-cols-3 gap-6 overflow-y-auto ">
    <div class="product bg-slate-800 rounded-xl p-4 text-center" data-name="Apple">
      <img src="https://images.unsplash.com/photo-1567306226416-28f0efdc88ce?w=300"
           class="w-full h-68 object-cover rounded-lg mb-3">
      <p class="font-semibold">Apple</p>
      <button class="mt-2 bg-green-500 text-black px-4 py-1 rounded-lg add-btn cursor-pointer hover:bg-green-700 hover:text-gray-200">
        Add
      </button>
    </div>

    <div class="product bg-slate-800 rounded-xl p-3 text-center" data-name="Grapes">
      <img src="https://plus.unsplash.com/premium_photo-1724250449759-f9bbb5fd4f63?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8Z3JhcGVzfGVufDB8fDB8fHww"
           class="w-full h-68 object-cover rounded-lg mb-1">
      <p class="font-semibold">Grapes</p>
      <button class="mt-2 hover:text-gray-200 bg-green-500 text-black px-4 py-1 rounded-lg add-btn cursor-pointer hover:bg-green-700">
        Add
      </button>
    </div>

    <div class="product bg-slate-800 rounded-xl p-4 text-center" data-name="WaterMelon">
      <img src="https://images.unsplash.com/photo-1582281298055-e25b84a30b0b?w=300"
           class="w-full rounded-lg mb-3">
      <p class="font-semibold">WaterMelon</p>
      <button class="mt-2 bg-green-500 text-black px-4 py-1 rounded-lg add-btn cursor-pointer hover:bg-green-200 hover:text-gray-500">
        Add
      </button>
    </div>
  </div>
<div class="w-1/3 bg-slate-800 rounded-2xl p-6 flex flex-col m-6 ">

    <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold mb-4">Cart</h2>
        <h2 id="clearall" class="text-xl font-bold mb-4 hover:bg-red-600 rounded-full p-1 cursor-pointer ">Clear All</h2>
    </div>

    <ul id="cartList" class="flex-1 space-y-2 "></ul>

    <div class="border-t border-slate-700 pt-4 flex justify-between text-lg font-semibold">
      <span>Total:</span>
      <span id="count" class="text-green-400">0</span>
    </div>
  </div>
  </div>

<script src="./cartstate.js"></script>
</body>

</html>
