<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./cartstate.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Text Formatter</title>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-linear-to-br  from-[#220330] to-[#000000] text-white flex items-center justify-center">
    
    <div class="flex">
        <a href="/dom.html">
        <i data-lucide="arrow-left" class="absolute left-10 top-6 w-8 h-8 bg-indigo-600 rounded-full hover:text-gray-300"></i>
    </a>
    <a href="/">
        <i data-lucide="home" class="absolute left-24 top-6 w-8 h-8 bg-green-600 rounded hover:text-gray-300"></i>
    </a>
    </div>

    <div
        class="flex flex-col p-8 w-9/12 md:w-1/2 py-36 md:py-56 bg-[#24115b] rounded-2xl gap-y-6 items-center justify-center text-[#FFFFFF]">
       <h1 
  id="count"
  class="text-8xl font-black 
         drop-shadow-lg 
         transition-colors duration-300">
  0
</h1>


<div class="flex gap-x-6 items-center justify-center">
  <button 
    id="inc"
    class="w-16 h-16 flex items-center justify-center 
           text-4xl font-bold rounded-full 
           bg-green-500 text-black 
           shadow-lg shadow-green-500/40
           hover:scale-110 active:scale-95 transition cursor-pointer">
    +
  </button>

  <button 
    id="dec"
    class="w-16 h-16 flex items-center justify-center 
           text-4xl font-bold rounded-full 
           bg-red-500 text-black 
           shadow-lg shadow-red-500/40
           hover:scale-110 active:scale-95 transition cursor-pointer">
    −
  </button>

  <button 
    id="reset"
    class="px-6 py-2 text-lg font-semibold 
           bg-blue-400 text-black 
           rounded-xl shadow-lg shadow-blue-400/40
           hover:scale-105 active:scale-95 transition cursor-pointer">
    Reset
  </button>
</div>


    </div>

    <script>
        lucide.createIcons();
    </script>

    <script type="module" src="./cartstate.js"></script>
</body>

</html>
