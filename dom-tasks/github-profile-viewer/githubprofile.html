  <link rel="preconnect" href="https://fonts.googleapis.com">

    rel="stylesheet">

  <div class="flex justify-center p-4">
    <div class="not-md:w-full w-2/4 bg-gray-800 rounded-2xl shadow-xl p-6">
      <h1 class="text-white text-2xl font-bold text-center mb-6">

      </h1>

      <div class="flex flex-col items-center justify-center  md:flex-row gap-2">

        <button id="searchBtn"
  class="flex items-center gap-2 cursor-pointer bg-green-500 hover:bg-green-600 text-black px-4 py-2 rounded-lg font-semibold">

</button>

    </div>
