<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Character Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="shortcut icon" href="/js.svg" type="image/x-icon/svg">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./charactercount.css">
</head>
<body class="bg-[#042139] text-black">

    <div class="flex">
        <a href="/dom.html">
        <i data-lucide="arrow-left" class="absolute text-white left-10 top-6 w-8 h-8 bg-indigo-600 rounded-full hover:text-gray-300"></i>
    </a>
    <a href="/">
        <i data-lucide="home" class="absolute left-24 top-6 w-8 h-8 bg-green-600 rounded hover:text-gray-300 text-white"></i>
    </a>
    </div>

  <div class="max-w-5xl mx-auto px-4 py-10 ">
    <h1 class="text-5xl font-bold text-center mb-2 text-white">Character Counter</h1>
    <p class="text-center font-semibold text-gray-200 mb-10">
      character counter with real-time text tracking
    </p>

    <div class="grid md:grid-cols-3 gap-6 items-center ">
      
      <div class="md:col-span-2">
          <label class="text-white text-xl pl-3" for="textInput">Enter Your Texts:</label>
        <div class="border border-blue-300 rounded-2xl p-4 bg-white backdrop-blur-md shadow-lg transition-all">
          <textarea
            id="textInput"
            class="w-full h-60 resize-none outline-none text-lg"
            placeholder="Start typing..."
          ></textarea>

          <div class="flex gap-3 mt-3">
            <button id="pasteBtn" class="flex items-center gap-2 px-4 py-2 rounded-lg border border-blue-500/70 hover:bg-slate-100">
              <i class="text-blue-700" data-lucide="clipboard"></i> Paste
            </button>
            <button id="clearBtn" class="flex items-center gap-2 px-4 py-2 border border-red-600/80  rounded-lg hover:bg-slate-100">
              <i class="text-red-400" data-lucide="trash"></i> Clear
            </button>
          </div>
        </div>
      </div>

    
<div id="countdiv" class="hidden bg-white/90 backdrop-blur-md border rounded-2xl p-5 space-y-4 shadow-lg transition-all duration-300">


  <div class="flex justify-between">
    <span>Characters (including spaces)</span>
    <span id="charWithSpace">0</span>
  </div>

  <div class="flex justify-between">
    <span>Characters (excluding spaces)</span>
    <span id="charWithoutSpace">0</span>
  </div>

  <div class="flex justify-between">
    <span>Words</span>
    <span id="words">0</span>
  </div>

  <div class="flex justify-between">
    <span>Paragraphs</span>
    <span id="paragraphs">0</span>
  </div>

  <div class="flex justify-between">
    <span>Letters</span>
    <span id="letters">0</span>
  </div>

  <div class="flex justify-between">
    <span>Spaces</span>
    <span id="spaces">0</span>
  </div>

  <div class="flex justify-between">
    <span>Lines</span>
    <span id="lines">0</span>
  </div>


  <div class="flex justify-between font-semibold">
    <span>Estimated Reading Time</span>
    <span><span id="readingTime">0</span> mins</span>
  </div>

</div>


    </div>
  </div>

  <script type="module" src="./charactercount.js"></script>
  <script>lucide.createIcons()</script>


</body>
</html>
