<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./password-toggler.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>PassWord Toggler</title>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="min-h-screen bg-linear-to-br  from-[#220e2a] to-[#03130c] text-white flex flex-col">

    <div class="flex gap-x-7 p-6 absolute">
        <a href="/dom.html">
            <i data-lucide="arrow-left"
                class=" left-10 top-6 w-8 h-8 bg-indigo-600 rounded-full hover:text-gray-300"></i>
        </a>
        <a href="/">
            <i data-lucide="home" class=" left-24 top-6 w-8 h-8 bg-green-600 rounded hover:text-gray-300"></i>
        </a>
    </div>

    <p class="absolute right-14 top-6 p-1  bg-green-600 animate-fade-login hidden" id="login-btn">Login Success!</p>

    <div class=" flex flex-1 items-center justify-center">

        <div
            class="bg-[#4c6aa877] w-9/12 h-90 sm:h-120 md:w-2/4 md:h-130 flex flex-col items-center justify-center rounded-2xl">

 <form action="#">
    <div class="flex flex-col space-y-8">

<div class="flex items-center gap-x-5 animate-fade-in">
    <h1 class="font-bold text-3xl shadow-2xl shadow-green-500/50">Login</h1>
     <i data-lucide="scan-face" class="text-green-400 w-10 h-10 "></i>

</div>


  <div class="flex flex-col">
    <label class="font-medium" for="mail-input">Enter Your Mail</label>
    <div class="flex items-center gap-x-5">
      <input
        placeholder="Enter Your Mail id"
        id="mail-input"
        type="email"
        class="outline bg-white w-90 px-3 py-2 text-black rounded">
      <i id="mail" data-lucide="mail" class="hover:text-green-300 cursor-pointer"></i>
    </div>
  </div>

  <div class="flex flex-col">
    <label class="font-medium" for="name-input">Enter Your Name</label>
    <div class="flex items-center gap-x-5">
      <input
        placeholder="Enter Your Name"
        id="name-input"
        type="text"
        class="outline bg-white w-90 px-3 py-2 text-black rounded">
      <i id="user" data-lucide="user" class="hover:text-green-300 cursor-pointer"></i>
    </div>
  </div>


  <div class="flex flex-col">
    <label class="font-medium" for="input">Enter Your Password</label>
    <div class="flex items-center gap-x-5">
      <input
        placeholder="Enter Your Password"
        id="input"
        type="password"
        class="outline bg-white w-90 px-3 py-2 text-black rounded">
      <i id="eye" data-lucide="eye" class="hover:text-green-300 cursor-pointer"></i>
    </div>
    <div class="flex items-center justify-center">
        <button type="submit" class="mt-7 bg-green-400 w-fit p-2 rounded-3xl text-black font-semibold hover:text-gray-700 cursor-pointer">Submit</button>
    </div>
  </div>

</div>
            </form>


            <p class="mt-12 px-3 text-red-500 bg-gray-800 rounded hidden" id="text">*Enter your password</p>
        </div>
    </div>


    <script>
        lucide.createIcons();
    </script>

    <script type="module" src="./password-toggler.js"></script>
</body>

</html>
